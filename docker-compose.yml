name: vigil-os

services:
  gateway:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost:8443/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://localhost:8443/ws}
        NEXT_PUBLIC_WORKER_ID: ${NEXT_PUBLIC_WORKER_ID:-W-001}
        NEXT_PUBLIC_WORKER_TOKEN: ${NEXT_PUBLIC_WORKER_TOKEN:-dev_device_worker_001}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","https://localhost:8443","https://127.0.0.1:8443"]}'
      VISION_MODEL_WEIGHTS: ${VISION_MODEL_WEIGHTS:-/app/ml_models/vigil-os-ppe.pt}
      VISION_CONFIDENCE_THRESHOLD: ${VISION_CONFIDENCE_THRESHOLD:-0.25}
      REDIS_URL: redis://redis:6379/0
      WORKER_API_TOKENS: '${WORKER_API_TOKENS:-["dev_device_worker_001"]}'
      WORKER_TELEMETRY_TTL_SECONDS: ${WORKER_TELEMETRY_TTL_SECONDS:-30}
      HARDWARE_API_TOKENS: '${HARDWARE_API_TOKENS:-["dev_device_machine_001"]}'
      HARDWARE_TELEMETRY_TTL_SECONDS: ${HARDWARE_TELEMETRY_TTL_SECONDS:-60}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api/ml_models:/app/ml_models:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
